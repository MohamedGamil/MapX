name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

  eval:
    name: Eval
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Scores the route, HTTP and Vue SFC fixtures; fails below scripts/eval/floors.json.
      - name: Score fixtures against recorded floors
        run: npm run eval

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build:npm

      # MapX checks its own layering (M5-18): .mapx/architecture.jsonc, with today's violations in
      # .mapx/architecture.baseline.json. The rest of .mapx/ is gitignored, so index the checkout first.
      - name: Index MapX
        id: index
        run: |
          node dist/main.js init . --no-agents --no-suggestions --no-mcp-configs
          node dist/main.js scan .

      # The gate: a new forbidden dependency (exit 1), a dependency on src/ code in no layer (exit 2) or a
      # stale baseline entry (exit 3) fails the job, annotated on the pull request.
      - name: Check architecture rules
        run: node dist/main.js check --fail-on-uncovered --format github

      # The same findings as SARIF, kept as an artifact. Uploading to code scanning would need
      # `security-events: write`, which pull requests from forks never get, so the job does not upload.
      - name: Write SARIF report
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        continue-on-error: true
        run: node dist/main.js check --fail-on-uncovered --report-skipped --format sarif -o mapx-architecture.sarif

      - name: Upload SARIF report
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: architecture-sarif
          path: mapx-architecture.sarif
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npx vitest run --coverage

      # Installs no longer build the dashboard (M4-05): build the package as a release would.
      - name: Build npm package
        run: npm run build:npm

      - name: Check package contents and dashboard size
        run: npx tsx scripts/check-package.ts

      # npm pack runs prepack (the dashboard) then prepare (tsup): the tarball must still hold it (M4-05).
      - name: Pack with lifecycle scripts keeps the dashboard
        run: rm -rf dist/ui && npm pack --dry-run --json | node scripts/check-pack-ui.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload coverage to Coveralls
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  ui:
    name: UI
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Dashboard smoke test on every tab, and the graph render budget (M4-19). Shared runners
      # are slower than the machine the M4-16 baseline was measured on: the budget is doubled.
      - name: Dashboard browser tests
        run: npm run test:ui
        env:
          MAPX_UI_PERF_SCALE: '2'

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/ui/
          retention-days: 7

  # The site (landing page and guides, M7). It runs on every CI run: the landing page reads src/ and
  # README.md, so a path filter would miss changes that break it. REQUIRE_SITE makes a missing install a
  # failure instead of a skip.
  site:
    name: Site
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Site tests
        run: npx vitest run tests/site-
        env:
          REQUIRE_SITE: '1'

      - name: Site browser tests
        run: npx playwright test -c playwright.site.config.ts

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-playwright-results
          path: test-results/site/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build WASM grammars
        run: npm run build:wasm

      - name: Build npm package
        run: npm run build:npm

      - name: Verify package contents
        run: npm pack --dry-run

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Init mapx
        run: npx tsx src/main.ts init . --no-agents --no-suggestions --no-mcp-configs

      - name: Scan codebase
        run: npx tsx src/main.ts scan .

      - name: Query with wildcard
        run: npx tsx src/main.ts query '*'

      - name: Search with glob and kind
        run: npx tsx src/main.ts search '*' --kind class --limit 5

      - name: Search with JSON format
        run: npx tsx src/main.ts search '*Service' --format json --limit 3

      - name: Fuzzy fallback test
        run: npx tsx src/main.ts callers 'NonExistentSymbolXYZ123' || true

      - name: Export LLM summary
        run: npx tsx src/main.ts export

      - name: Status check
        run: npx tsx src/main.ts status .

      - name: Cleanup
        run: rm -rf .mapx
