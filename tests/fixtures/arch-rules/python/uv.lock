# Synthetic (M5-22): hand-written in uv's lock format from the packages' real dependencies; sdist
# and wheel entries are left out. Labelled in expected-externals.json.
version = 1
revision = 2
requires-python = ">=3.11"

[[package]]
name = "arch-python"
version = "0.0.0"
source = { virtual = "." }
dependencies = [
    { name = "flask" },
    { name = "pyyaml" },
    { name = "requests", extra = ["socks"] },
    { name = "sqlalchemy" },
]

[package.optional-dependencies]
imaging = [
    { name = "pillow" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "flask", specifier = ">=3.0" },
    { name = "pillow", marker = "extra == 'imaging'", specifier = ">=10.0" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "requests", extras = ["socks"], specifier = ">=2.31" },
    { name = "sqlalchemy", specifier = ">=2.0" },
]
provides-extras = ["imaging"]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = ">=8.0" }]

[[package]]
name = "blinker"
version = "1.8.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "certifi"
version = "2024.7.4"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "charset-normalizer"
version = "3.3.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "click"
version = "8.1.7"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
]

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "flask"
version = "3.0.3"
source = { registry = "https://pypi.org/simple" }
