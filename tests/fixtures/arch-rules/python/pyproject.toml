[project]
name = "arch-python"
version = "0.0.0"
# M5-22: what the app depends on, labelled in expected-externals.json (real public packages).
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "requests[socks]>=2.31",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
imaging = ["pillow>=10.0"]

[dependency-groups]
dev = ["pytest>=8.0"]
